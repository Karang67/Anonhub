<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnonHub - Anonymous Chat</title>
  <meta name="description"
    content="Join AnonHub's anonymous chat rooms. Collaborate and chat in real-time without registration." />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/chat.css" />
</head>

<body class="chat-page">
  <header class="header">
    <h1 class="logo-text">AnonHub</h1>
    <nav class="header-links">
      <a href="/">Home</a>
      <a href="/about.html">About</a>
      <a href="/help.html">Help</a>
      <a href="/document.html">Document Board</a>
      <a href="/code.html">Coding Board</a>
    </nav>
    <div class="header-actions">
      <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Theme">🌙 Dark Mode</button>
      <button id="menu-toggle" class="menu-toggle-btn" aria-label="Toggle Navigation">☰</button>
    </div>

  </header>

  <main class="chat-container">
    <div class="chat-main">
      <div class="header-bar">
        <span id="room-info">Loading Room...</span>
        <button id="sidebar-toggle" class="mobile-only-btn" type="button">👥 Users</button>
      </div>
      <ul class="chat-messages" id="messages"></ul>
      <div id="typing-indicator" class="typing-indicator"></div>
      <form class="message-form" id="form">
        <input class="chat-input" id="input" autocomplete="off" placeholder="Type your message..."
          aria-label="Type your message" />
        <button type="submit" aria-label="Send message">Send</button>
      </form>
    </div>
    <aside class="chat-sidebar">
      <h4>Users in Room</h4>
      <ul id="user-list" class="user-list"></ul>
    </aside>
  </main>
  <footer class="footer">
    <p1>&copy; 2025 AnonHub. All rights reserved.</p1>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/chat.js"></script>

  <script src="/js/theme.js"></script>
</body>

</html>
