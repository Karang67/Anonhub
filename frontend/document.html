<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Collaborative Document Board — AnonHub</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/project.css" />
  <script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.2/tinymce.min.js"></script>
</head>

<body class="project-page">
  <header class="header">
    <h1 class="logo-text">AnonHub</h1>
    <nav class="header-links">
      <a href="/">Home</a>
      <a href="/about.html">About</a>
      <a href="/help.html">Help</a>
      <a href="/document.html" class="active">Document Board</a>
      <a href="/code.html">Coding Board</a>
    </nav>
    <div class="header-actions">
      <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Theme">🌙 Dark Mode</button>
      <button id="menu-toggle" class="menu-toggle-btn" aria-label="Toggle Navigation">☰</button>
    </div>
  </header>

  <!-- System Notifications/Warnings Banner -->
  <div id="system-notifications" class="system-notifications" style="max-width: 1200px; margin: 20px auto 0 auto; padding: 0 32px; display: flex; flex-direction: column; gap: 10px;"></div>

  <main class="project-editor-wrapper">
    <div class="collaboration-editor">
      <div class="workspace-header-bar">
        <div class="workspace-title-area">
          <h2 id="project-title">Document Board</h2>
        </div>
      </div>

      <div class="workspace-panes">
        <!-- 📝 Document Board (TinyMCE) Pane -->
        <div id="pane-document" class="workspace-pane active">
          <textarea id="project-content" placeholder="Start collaborating on your rich-text project here..."></textarea>
        </div>
      </div>
    </div>

    <aside class="project-chat-container">
      <div class="panel-section">
        <h4 style="margin-top: 0; display: flex; align-items: center; gap: 8px;">Project Chat <span id="chat-status-dot" style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#ff4d4f; transition: background-color 0.3s ease;" title="Disconnected"></span></h4>
        <ul id="project-chat-messages" class="chat-messages"></ul>
        <form id="project-chat-form" class="message-form">
          <input id="project-chat-input" type="text" autocomplete="off" placeholder="Message..."
            class="chat-form-control" />
          <button type="submit">Send</button>
        </form>
      </div>

      <div class="panel-section">
        <h4>Users in Project</h4>
        <ul id="user-list" class="user-list"></ul>
      </div>
    </aside>
  </main>

  <footer class="footer">
    <p1>&copy; 2025 AnonHub. All rights reserved.</p1>
  </footer>

  <!-- Join Room Overlay Modal -->
  <div id="room-join-overlay" class="room-overlay" style="display: none;">
    <div class="room-overlay-content">
      <h2>Collaborative Document Board</h2>
      <p>Enter a room name to join or create a shared document session.</p>
      <form id="overlay-join-form">
        <input type="text" id="overlay-room-name" placeholder="Enter room name..." required autocomplete="off" />
        <button type="submit">Collaborate</button>
        <button type="button" onclick="window.location.href='/'" class="btn-secondary-modal">Back to Home</button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomOverlay = document.getElementById("room-join-overlay");
      const joinForm = document.getElementById("overlay-join-form");
      const roomInput = document.getElementById("overlay-room-name");

      const roomName = urlParams.get("project");
      if (roomName) {
        // Background call to make sure project exists in DB
        fetch('/create-project', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: roomName })
        }).catch(err => console.error("Error creating/ensuring project:", err));
      } else {
        // Show overlay if no project is in the URL
        roomOverlay.style.display = "flex";
        
        joinForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const name = roomInput.value.trim();
          if (name) {
            // Redirect to URL with query param to trigger project.js loading
            window.location.href = window.location.pathname + "?project=" + encodeURIComponent(name);
          }
        });
      }
    });
  </script>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/project.js"></script>
  <script src="/js/theme.js"></script>
</body>

</html>
